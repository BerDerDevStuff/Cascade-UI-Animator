<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<style><![CDATA[
#fb_icon_to {
  opacity: 0;
  animation: fb_icon_move 800ms cubic-bezier(0.175,0.885,0.32,1.275) 0ms 1 normal forwards;
}
@keyframes fb_icon_move {
  0% { transform: translate(-10px,24px); opacity: 0; }
  100% { transform: translate(23.5px,24px); opacity: 1; }
}
#fb_t1_to {
  opacity: 0;
  animation: fb_t1_move 800ms cubic-bezier(0.175,0.885,0.32,1.275) 150ms 1 normal forwards;
}
@keyframes fb_t1_move {
  0% { transform: translate(120px,19px); opacity: 0; }
  100% { transform: translate(48px,19px); opacity: 1; }
}
#fb_t2_to {
  opacity: 0;
  animation: fb_t2_move 800ms cubic-bezier(0.175,0.885,0.32,1.275) 300ms 1 normal forwards;
}
@keyframes fb_t2_move {
  0% { transform: translate(140px,36px); opacity: 0; }
  100% { transform: translate(48px,36px); opacity: 1; }
}
]]></style>
<rect width="160" height="48" rx="4" ry="4" fill="#f59e0b"/>
<!-- Speech bubble — centered at origin -->
<g id="fb_icon_to">
  <path d="M-15,-11 Q-15,-14 -12,-14 L12,-14 Q15,-14 15,-11 L15,4 Q15,7 12,7 L-2,7 L-8,14 L-8,7 L-12,7 Q-15,7 -15,4 Z" fill="#fff"/>
  <circle cx="-6" cy="-3.5" r="2.2" fill="#f59e0b"/>
  <circle cx="0" cy="-3.5" r="2.2" fill="#f59e0b"/>
  <circle cx="6" cy="-3.5" r="2.2" fill="#f59e0b"/>
</g>
<!-- Text -->
<g id="fb_t1_to">
  <text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="9" fill="#fff" letter-spacing="0.5" opacity="0.85">GIVE</text>
</g>
<g id="fb_t2_to">
  <text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="13" fill="#fff" letter-spacing="0.8">FEEDBACK</text>
</g>
</svg>
