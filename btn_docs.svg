<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<style><![CDATA[
#docs_icon_to {
  opacity: 0;
  animation: docs_icon_move 800ms cubic-bezier(0.175,0.885,0.32,1.275) 0ms 1 normal forwards;
}
@keyframes docs_icon_move {
  0% { transform: translate(-10px,24px); opacity: 0; }
  100% { transform: translate(23.5px,24px); opacity: 1; }
}
#docs_t1_to {
  opacity: 0;
  animation: docs_t1_move 800ms cubic-bezier(0.175,0.885,0.32,1.275) 150ms 1 normal forwards;
}
@keyframes docs_t1_move {
  0% { transform: translate(120px,19px); opacity: 0; }
  100% { transform: translate(48px,19px); opacity: 1; }
}
#docs_t2_to {
  opacity: 0;
  animation: docs_t2_move 800ms cubic-bezier(0.175,0.885,0.32,1.275) 300ms 1 normal forwards;
}
@keyframes docs_t2_move {
  0% { transform: translate(140px,36px); opacity: 0; }
  100% { transform: translate(48px,36px); opacity: 1; }
}
]]></style>
<rect width="160" height="48" rx="4" ry="4" fill="#7c3aed"/>
<!-- Open book icon — centered at origin -->
<g id="docs_icon_to">
  <path d="M-14,-12 C-14,-12 -7,-14.5 -1,-12 L-1,12 C-7,9.5 -14,12 -14,12 Z" fill="#fff" opacity="0.95"/>
  <path d="M1,-12 C1,-12 8,-14.5 14,-12 L14,12 C8,9.5 1,12 1,12 Z" fill="#fff" opacity="0.95"/>
  <rect x="-1.5" y="-12" width="3" height="24" fill="#7c3aed" opacity="0.5"/>
</g>
<!-- Text — positioned by animation, drawn at origin -->
<g id="docs_t1_to">
  <text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="9" fill="#fff" letter-spacing="0.5" opacity="0.85">READ THE</text>
</g>
<g id="docs_t2_to">
  <text x="0" y="0" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="16" fill="#fff" letter-spacing="1">DOCS</text>
</g>
</svg>
